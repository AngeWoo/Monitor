<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Monitor Health</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css?v=20260315-a033" />
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-card">
      <div class="loading-text">
        <span id="loadingLabel">載入中...</span>
        <strong id="loadingPercent">0%</strong>
      </div>
      <div class="loading-bar"><div id="loadingBarInner" class="loading-bar-inner"></div></div>
    </div>
  </div>
  <div class="bg-gradient"></div>
  <header class="topbar">
    <div>
      <h1>Service Monitor</h1>
      <p>後台健康檢查 &nbsp;<span id="hostBadge" class="host-badge" title="監控來源主機"></span></p>
    </div>
    <nav>
      <a href="./index.html">Dashboard</a>
      <a href="./admin.html">管理設定</a>
      <a class="active" href="./health.html">健康檢查</a>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-header">
        <h2>健康檢查摘要</h2>
        <div class="row-actions">
          <button id="runNowBtn" class="btn secondary" type="button">立即執行</button>
          <button id="refreshBtn" class="btn" type="button">重新整理</button>
        </div>
      </div>
      <div class="summary-grid" id="healthSummary"></div>
      <p id="healthMessage" class="message"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>逾時或異常服務</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>服務名稱</th>
              <th>檢查間隔(分)</th>
              <th>最後檢查</th>
              <th>下次預定</th>
              <th>狀態</th>
              <th>HTTP</th>
              <th>錯誤訊息</th>
              <th>原因</th>
            </tr>
          </thead>
          <tbody id="staleBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>通知發送紀錄</h2>
        <div class="row-actions">
          <button id="mailLogTabBtn" class="btn tiny secondary active" type="button" data-log-channel="mail">郵件</button>
          <button id="lineLogTabBtn" class="btn tiny secondary" type="button" data-log-channel="line">LINE</button>
          <button id="notifyLogRefreshBtn" class="btn tiny secondary" type="button">重新載入</button>
          <button id="notifyLogClearBtn" class="btn tiny danger" type="button">清除紀錄</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>發送時間</th>
              <th>觸發方式</th>
              <th>結果</th>
              <th>異常 / 服務</th>
              <th>對象</th>
              <th>主旨</th>
              <th>備註</th>
            </tr>
          </thead>
          <tbody id="notifyLogBody"></tbody>
        </table>
      </div>
      <div class="history-footer">
        <span id="notifyLogPageInfo" class="hint"></span>
        <div class="row-actions">
          <button id="notifyLogPrevBtn" class="btn tiny secondary" type="button">上一頁</button>
          <button id="notifyLogNextBtn" class="btn tiny secondary" type="button">下一頁</button>
        </div>
      </div>
      <p id="notifyLogMessage" class="message"></p>
    </section>
  </main>

<script type="module" src="./assets/health.js?v=20260315-a030"></script>
</body>
</html>
